test {
  browser {
    type = "CHROME"
    execution = "LOCAL"
    headless = true
    window {
      width = 1280
      height = 800
    }
    remote-url = "http://localhost:4444"
  }

  waits {
    timeout = 10s
    polling = 100ms
  }

  environment {
    web-base-url = "https://the-internet.herokuapp.com/"
    api {
      base-url = "http://127.0.0.1:8080"
      connect-timeout = 3s
      response-timeout = 10s
    }
    database {
      # Safe local H2 defaults. Real DB credentials must come from env/JVM/CI secrets.
      jdbc-url = "jdbc:h2:mem:selenium_template;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
      username = "sa"
      password = ""
      maximum-pool-size = 5
      connection-timeout = 5s
    }
  }
}
