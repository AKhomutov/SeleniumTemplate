# Reference docker-selenium stack for REMOTE profile (vendor-neutral Selenium endpoint).
# Image pin: readable tag + authoritative digest (update both together — see README).
services:
  selenium-chrome:
    image: selenium/standalone-chrome:4.49.0@sha256:88dacdd42d93ab738bed045129376b2f965117c5f2e4710693e54695d531380d
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      # Standalone defaults to one session; raise only when you understand queueing/parallelism trade-offs.
      SE_NODE_MAX_SESSIONS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
